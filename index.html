<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DBA Study Notes</title>
<style>
:root { --bg: #f3f5f9; --surface: #ffffff; --fg: #1c1d21; --muted: #6b6d75; --line: #e6e3dc; --accent: #3b6fd8; --bad: #dc2626; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font: 16px/1.7 "Segoe UI", Tahoma, sans-serif; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 26px 24px; box-shadow: 0 4px 24px rgba(0,0,0,.06); display: grid; gap: 12px; text-align: center; }
.icon { font-size: 34px; }
h1 { margin: 0; font-size: 1.3em; }
p { margin: 0; color: var(--muted); font-size: .92em; }
input[type=password] { font: inherit; width: 100%; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); text-align: center; direction: ltr; }
input[type=password]:focus { outline: 2px solid var(--accent); border-color: transparent; }
label { display: flex; gap: 8px; justify-content: center; align-items: center; font-size: .88em; color: var(--muted); }
button { font: inherit; font-weight: 700; padding: 11px; border-radius: 11px; border: 0; cursor: pointer; background: var(--accent); color: #fff; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--bad); font-weight: 600; min-height: 1.4em; }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "dba-pass";
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }

const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true; err.textContent = "";
  try {
    const html = await unlock(pw.value);
    set(KEY, document.getElementById("keep").checked ? pw.value : null);
    show(html);
  } catch (x) {
    err.textContent = "Wrong password. Try again.";
    go.disabled = false; pw.select();
  }
});
const saved = get(KEY);
if (saved) unlock(saved).then(show).catch(() => set(KEY, null));
</script>
